[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.4", features = ["json"] }

aws-config = "1.0"
aws-sdk-s3 = "1.0"
lambda_runtime = "1.3.0"
